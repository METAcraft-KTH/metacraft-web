services:
  web:
    build: .
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    # The Museum Collection Competition API reads the mod's MySQL database; see .env.example.
    environment:
      MUSEUM_DB_HOST: ${MUSEUM_DB_HOST:-}
      MUSEUM_DB_PORT: ${MUSEUM_DB_PORT:-3306}
      MUSEUM_DB_NAME: ${MUSEUM_DB_NAME:-metacraft}
      MUSEUM_DB_USER: ${MUSEUM_DB_USER:-metacraft}
      MUSEUM_DB_PASSWORD: ${MUSEUM_DB_PASSWORD:-}
      MUSEUM_DB_TABLE_PREFIX: ${MUSEUM_DB_TABLE_PREFIX:-museum_}
    # lets MUSEUM_DB_HOST=host.docker.internal reach a database running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
